# Redaction rules for India (ADR-0015). Nothing reads this file unless a
# deployment sets DSS_REDACTION_ENABLED=true and points DSS_REDACTION_CONFIG_PATH
# at it.
#
# Two parts:
#   entities     the policy, for every identifier: keep the real value for the
#                one provider call that may need it, or destroy it. An entity
#                an identifier reports that is not listed here is destroyed.
#   identifiers  which identifiers find PII, run side by side. Each has a
#                `type` and its own settings.
#
# Aadhaar and card are destroyed: the Aadhaar Act limits who may hold an Aadhaar
# number, and card data brings PCI scope. Confirm with counsel before changing.

entities:
  aadhaar: destroy
  card: destroy
  gstin: keep
  pan: keep
  ifsc: keep
  phone: keep
  email: keep
  person: keep

identifiers:
  # Patterns confirmed by a validator, and phrases that announce a name.
  #   entity     the tag it leaves behind — «phone_1». Lower case.
  #   kind       pattern | declaring_phrase
  #   pattern    a Python regular expression, run with number gaps joined
  #   validator  format | verhoeff | luhn | gstin — confirms a match is real
  - type: regex
    normalisation:
      join_separators: [" ", "-"]
      max_separators: 2

    rules:
      - entity: aadhaar
        kind: pattern
        pattern: '(?<!\d)[2-9]\d{11}(?!\d)'
        validator: verhoeff

      - entity: card
        kind: pattern
        pattern: '(?<!\d)\d{13,19}(?!\d)'
        validator: luhn

      - entity: gstin
        kind: pattern
        pattern: '(?i)\b\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]\b'
        validator: gstin

      # 5 letters, 4 digits, 1 letter. The 4th letter is the holder type.
      - entity: pan
        kind: pattern
        pattern: '(?i)\b[A-Z]{3}[ABCFGHJLPT][A-Z]\d{4}[A-Z]\b'

      # 4 letters, a zero, 6 letters or digits.
      - entity: ifsc
        kind: pattern
        pattern: '(?i)\b[A-Z]{4}0[A-Z0-9]{6}\b'

      # 10 digits starting 6-9, with an optional +91, 0091, 91 or 0 in front.
      - entity: phone
        kind: pattern
        pattern: '(?<![\d+])(?:(?:\+|00)?91|0)?[6-9]\d{9}(?!\d)'

      - entity: email
        kind: pattern
        pattern: '[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}'

      # A name only when the farmer announces it. A name mentioned in passing is
      # not caught here (#136). Add phrases per language as speakers supply them.
      - entity: person
        kind: declaring_phrase
        phrases: ["my name is", "my name's"]
        max_tokens: 3
        stopwords: [and, from, in, i, my, here, please, sir, madam]

  # People's names the farmer did not announce, by a model (ADR-0016).
  #   spacy  en_core_web_sm: small and fast, English only. On romanised
  #          Hinglish it misses names and tags ordinary words ("gehu") as
  #          people. Remove this entry for patterns only.
  - type: spacy
    entity: person
