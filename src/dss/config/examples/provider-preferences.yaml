# Which providers a client wants, per topic, best first (ADR-0019).
#
# SAMPLE IDS. The client ids and provider ids below are examples — replace
# them with the ones your deployment actually serves and talks to. The
# provider ids are the network's own, as published by the provider registry
# and as they arrive on a /discover response.
#
# Mount this with DSS_PROVIDER_PREFERENCES_PATH. Unset, nothing here applies
# and every ask keeps whichever providers discovery found.
#
# Two rules worth knowing before editing:
#
#   1. A ranking is the WHOLE answer for its topic. A provider discovery
#      found that the list does not name is never called. Adding a provider
#      to the network does not add it to a client that ranked the topic.
#   2. The fallback is per topic, not per client. A client that ranks only
#      Weather is served the `default` list for Market.
#
# Topics are the subject categories an ask carries: Crop, Livestock, Weather,
# Market, Scheme, Facility. A topic no list names keeps today's behaviour —
# every provider, in discovery's own order.

version: 1

# Used for a caller that sends no X-Client-Id header, one nobody configured
# below, and any topic a configured client did not rank itself.
default:
  Weather: [mausamgram-mock]
  Market: [agmarknet-mock]
  Crop: [kvk-advisory-mock]

clients:
  # An experience layer that has vetted a state provider and wants it asked
  # first, falling back to the national one when it has nothing.
  kisan-mitra-web:
    Weather: [maharashtra-vistaar, mausamgram-mock]
    Market: [agmarknet-mock]

  # One that trusts only its own state provider for weather. Nothing else is
  # ranked, so its Market and Crop asks are served by `default` above.
  vistaar-whatsapp:
    Weather: [maharashtra-vistaar]
