[project]
name = "decision-support-system"
version = "0.1.0"
description = "Decision Support System — reasoning runtime for the OpenAgriNet Experience Layer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.14.2",
    # pydantic-ai-slim, not pydantic-ai: the metapackage ships no code of its own
    # and force-installs anthropic, google-genai, logfire, mcp, evals, cli, and web.
    # The LLM provider is a swappable adapter behind a port (DSS_ARCHITECTURE.md §4.3),
    # so extras are declared explicitly as adapters are built.
    "httpx2>=2.12.0",
    "pydantic-ai-slim[openai]>=2.33.0",
    # Settings binding for the moderation LLM knobs and config paths (spec 0002).
    "pydantic-settings>=2.5.0",
    # The policy loader deserialises the mounted YAML pack (spec 0003), and the
    # schema-pack index parses attributes.yaml.
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

# src/dss does not match the distribution name, so the package path is explicit.
[tool.hatch.build.targets.wheel]
packages = ["src/dss"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    # Coverage is reported on every run (report-only, no gate) so regressions are
    # visible without blocking a merge — see [tool.coverage] and addopts below.
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "jsonschema>=4.26.0",
    # Dev-only test harnesses under examples/ — NOT the committed entrypoint
    # (that needs an ADR; DSS_ARCHITECTURE.md §8.3). fastapi/uvicorn back the
    # curl server; logfire ships Pydantic AI's OpenTelemetry instrumentation and
    # exports traces to a self-hosted Langfuse via standard OTEL_* env vars.
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "logfire>=3.0.0",
    "pytest-httpserver>=1.1.5",
]

# ---------------------------------------------------------------------------
# Linting & formatting — ruff only; it replaces black, flake8, and isort.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py313"
# Docs contain illustrative Python in fenced blocks whose alignment is
# deliberate. Formatting them rewrites the prose's meaning, so they are excluded.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "TID", # flake8-tidy-imports — carries the framework-boundary ban below
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

# Hard boundary: only orchestration/ may import the agentic framework.
# banned-api is global with no per-directory table, so the ban is declared once
# and orchestration/ is exempted here.
#
# pydantic_graph is banned alongside pydantic_ai deliberately: pydantic-ai-slim
# pulls pydantic-graph as a *core* dependency under a separate top-level import
# name, so banning only pydantic_ai would leave core/ able to import the graph
# library.
[tool.ruff.lint.per-file-ignores]
"src/dss/orchestration/**/*.py" = ["TID251"]
"tests/integration/orchestration/**/*.py" = ["TID251"]
# adapters/ is the one place outside orchestration/ where vendor/framework SDK
# code is allowed to live (CLAUDE.md folder structure; ADR-0001 §4.3): the
# LLMProvider port is implemented here against Pydantic AI. core/ stays clean —
# the AST boundary test in tests/unit/test_framework_boundary.py only guards core/.
"src/dss/adapters/**/*.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pydantic_ai".msg = "Only src/dss/orchestration may import Pydantic AI. core/ must stay framework-agnostic — depend on ports/ instead."
"pydantic_graph".msg = "Only src/dss/orchestration may import pydantic-graph. core/ must stay framework-agnostic."

# ---------------------------------------------------------------------------
# Editors default to the system interpreter and then cannot resolve pytest or
# pydantic. This points them at the project venv. Type checking is not a gate;
# ruff is the only enforced tool.
# ---------------------------------------------------------------------------
[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]

# ---------------------------------------------------------------------------
# Tests — the `eval` marker is excluded from the default run because the tier
# table in CLAUDE.md requires tier 6 to be a scheduled job that never blocks a
# merge. Without this, the documented `pytest` command would collect it.
# Run it deliberately with `pytest -m eval`.
#
# The table must be `[tool.pytest.ini_options]`, not `[tool.pytest]` — pytest
# silently ignores the latter, which leaves the eval exclusion, --strict-config
# and strict_markers all inert with no warning that the config was skipped.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# async tier-1 tests (the LLMProvider port is async) run without per-test markers.
asyncio_mode = "auto"
# import-mode=importlib lets the mirrored test tree carry duplicate basenames
# (tests/unit/core/*/test_service.py) without __init__ packages or name clashes.
addopts = [
    "-ra",
    "--strict-config",
    "--import-mode=importlib",
    "-m",
    "not eval",
    # Coverage is monitored, not gated: report the gaps every run, but never fail
    # the build on a threshold (no --cov-fail-under). Keeps coverage visible
    # without turning it into a merge blocker.
    "--cov=src/dss",
    "--cov-report=term-missing",
]
markers = [
    "eval: tier-6 end-to-end quality eval; diagnostic only, never a merge gate",
    "anyio: marks a test to run under anyio's async test runner",
]
strict_markers = true

# ---------------------------------------------------------------------------
# Coverage — report-only (see addopts). `eval` and the dev-only harness under
# examples/ are excluded from the measured surface; they are not the core that
# the tier-1 suite is meant to cover.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/dss"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
