# Export hub: one OTLP stream in, two destinations out.
# - Langfuse: traces with prompts and answers, for debugging.
# - ClickHouse: traces, metrics and logs without content, for dashboards.
# Two trace pipelines, because a pipeline cannot branch after a processor.

receivers:
  otlp:
    protocols:
      http:
        # 0.0.0.0: the DSS connects from another container.
        endpoint: 0.0.0.0:4318

processors:
  batch:

  # Only named attributes reach ClickHouse; anything unknown is dropped.
  # Nothing redacts farmer text before this point.
  # Fails closed: an erroring statement drops the batch.
  transform/clickhouse_allowlist:
    error_mode: propagate
    trace_statements:
      - statements:
          - 'keep_matching_keys(span.attributes, "^(dss\\..+|status|first_delta_ms|composed_ms|asks_(total|failed)|answer_count|attempts|capabilities|capability_count|capability|provider_id|(offered|answered)_provider_ids|answered|failure_class|(intent|moderation|planner|composer)_model|agent_name|model_name|session\\.id|langfuse\\.(session\\.id|trace\\.metadata\\.(transaction_id|message_id))|gen_ai\\.(agent\\.(name|call\\.id)|conversation\\.id|operation\\.name|provider\\.name|system|request\\.(model|temperature)|response\\.(finish_reasons|id|model)|tool\\.(name|call\\.id)|usage\\..+|aggregated_usage\\..+|client\\.operation\\.time_to_first_chunk)|operation\\.cost|server\\.address|http\\.status_code|logfire\\.(span_type|level_num))$")'
          # Status messages carry exception text.
          - 'set(span.status.message, "") where span.status.message != ""'
      # Exceptions keep their type, not their message.
      - statements:
          - 'keep_keys(spanevent.attributes, ["exception.type", "exception.escaped", "elapsed_ms"])'

exporters:
  # Traces only; Langfuse drops metrics.
  otlphttp/langfuse:
    traces_endpoint: ${env:LANGFUSE_OTLP_ENDPOINT}
    headers:
      Authorization: ${env:LANGFUSE_AUTH_HEADER}

  clickhouse:
    # Native protocol: tcp://host:9000.
    endpoint: ${env:CLICKHOUSE_ENDPOINT}
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    # Shared database; rows are told apart by service.name.
    database: ${env:CLICKHOUSE_DATABASE}
    # Creates tables if absent. Check the schema before sharing a database.
    create_schema: true
    # 30 days, same as Langfuse. Set at table creation; changing it needs an ALTER.
    ttl: 720h
    # Default retry and queue: in memory, drop on overflow.

service:
  pipelines:
    traces/langfuse:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/langfuse]

    traces/clickhouse:
      receivers: [otlp]
      # Allowlist first, so nothing downstream sees content.
      processors: [transform/clickhouse_allowlist, batch]
      exporters: [clickhouse]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse]
