# A collector that prints what arrives. For looking at spans and metrics
# locally; a deployment replaces this file with one that forwards somewhere.
#
# The metrics pipeline only sees anything when the DSS is started with
# OTEL_METRICS_EXPORTER=otlp. That ships off, because the usual endpoint is
# Langfuse and Langfuse discards metrics.
receivers:
  otlp:
    protocols:
      http:
        # 0.0.0.0, not localhost: the DSS reaches this from another container.
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    # `detailed` prints every attribute, which is the point of running this at
    # all — including seeing that message bodies are absent.
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
