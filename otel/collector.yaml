# The export hub. The DSS sends one OTLP stream here; this fans it
# out to two places that want different things.
#
# Langfuse wants the words. It answers "why did the model say that", which
# needs the prompt and the completion, and it is reached by people through its
# own login.
#
# ClickHouse wants the numbers. Grafana sits on top of it and answers "how
# often, how slow, how much" — none of which needs a farmer's query. So only
# named, known-safe attributes go on, by `transform/clickhouse_allowlist` below.
#
# That split is the whole reason there are two `traces/*` pipelines rather than
# one: a pipeline cannot branch after a processor, so a single pipeline would
# have to send stripped spans to both or unstripped spans to both.
#
# This file is for a deployment, where both destinations exist. A laptop uses
# `collector.local.yaml`, which has no ClickHouse.

receivers:
  otlp:
    protocols:
      http:
        # 0.0.0.0, not localhost: the DSS reaches this from another container.
        endpoint: 0.0.0.0:4318

processors:
  batch:

  # An allowlist, not a denylist. Nothing redacts a farmer's words before this
  # yet (DSS_ARCHITECTURE.md §6.2), so this is the only thing between them and
  # a shared database. The denylist it replaces named six content keys and
  # missed `final_result` — every agent run's full output — and exception text.
  # A key pydantic-ai adds or renames is now dropped rather than shipped.
  #
  # Kept: our own attributes (`dss.*`, status, timings, ask counts, model
  # names), ids for joining to Langfuse, and gen_ai model, usage and tool
  # *names*. Dropped: everything else, including tool arguments and results.
  # To send something new to ClickHouse, add it here and to the test that
  # reads this list (tests/unit/test_collector_allowlist.py).
  #
  # `propagate`: a statement that errors drops the batch instead of passing it
  # through unfiltered.
  transform/clickhouse_allowlist:
    error_mode: propagate
    trace_statements:
      - statements:
          - 'keep_matching_keys(span.attributes, "^(dss\\..+|status|first_delta_ms|composed_ms|asks_(total|failed)|answer_count|attempts|capabilities|capability_count|provider_id|(intent|moderation|planner|composer)_model|agent_name|model_name|session\\.id|langfuse\\.(session\\.id|trace\\.metadata\\.(transaction_id|message_id))|gen_ai\\.(agent\\.(name|call\\.id)|conversation\\.id|operation\\.name|provider\\.name|system|request\\.(model|temperature)|response\\.(finish_reasons|id|model)|tool\\.(name|call\\.id)|usage\\..+|aggregated_usage\\..+|client\\.operation\\.time_to_first_chunk)|operation\\.cost|server\\.address|http\\.status_code|logfire\\.(span_type|level_num))$")'
          # The status says a span failed; its message is exception text.
          - 'set(span.status.message, "") where span.status.message != ""'
      # `exception` events keep what failed by type, never by message.
      - statements:
          - 'keep_keys(spanevent.attributes, ["exception.type", "exception.escaped", "elapsed_ms"])'

exporters:
  # Traces only. Langfuse discards metrics, which is why they were off by
  # default before this file existed.
  otlphttp/langfuse:
    traces_endpoint: ${env:LANGFUSE_OTLP_ENDPOINT}
    headers:
      Authorization: ${env:LANGFUSE_AUTH_HEADER}

  clickhouse:
    # tcp://host:9000 — ClickHouse's native port, not the HTTP 8123.
    endpoint: ${env:CLICKHOUSE_ENDPOINT}
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    # A shared server. `service.name` is what separates DSS rows from whatever
    # else writes here, so the DSS sets OTEL_SERVICE_NAME — without it every
    # row says `unknown_service` and no dashboard can filter.
    database: ${env:CLICKHOUSE_DATABASE}
    # Tables are created on first write if absent. Verify the existing schema
    # before pointing this at a database another collector already writes to:
    # ours would insert into its tables, and a mismatch fails at runtime.
    create_schema: true
    # 30 days, the same window Langfuse keeps. One retention story for
    # both stores is easier to state and easier to defend than two. Applied as
    # a table TTL at creation, so changing it later means an ALTER, the way
    # `scripts/langfuse-retention.sh` does it.
    ttl: 720h
    # Retry and queue are left at their defaults on purpose: retry in memory,
    # drop on overflow. Telemetry is lost during a long ClickHouse outage,
    # which is the cheaper failure — a disk buffer trades it for a disk-full
    # mode that takes the collector down with it.

service:
  pipelines:
    traces/langfuse:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/langfuse]

    traces/clickhouse:
      receivers: [otlp]
      # Strip first, batch second. The order is not cosmetic: batching first
      # would still work, but keeping the deletion adjacent to the receiver
      # makes it obvious that nothing downstream of here has the content.
      processors: [transform/clickhouse_allowlist, batch]
      exporters: [clickhouse]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse]
