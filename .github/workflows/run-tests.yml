name: Run Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # Two tiers are deliberately not run here:
      #   - tier 6 (eval) is excluded by `-m "not eval"` in pyproject.toml addopts.
      #   - tier 7 (tests/e2e) calls a real model, so it is excluded by path.
      - name: Test
        run: >
          uv run pytest --ignore=tests/e2e
          --cov=src/dss --cov-report=term-missing --cov-fail-under=85
