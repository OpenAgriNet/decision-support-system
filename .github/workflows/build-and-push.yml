name: Build and Push

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Trivy cache date
        id: trivy-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy binary and vulnerability DB
        uses: actions/cache@v4
        with:
          path: |
            bin/trivy
            ~/.cache/trivy
          key: trivy-${{ runner.os }}-${{ runner.arch }}-${{ steps.trivy-date.outputs.date }}
          restore-keys: |
            trivy-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Trivy (if not cached)
        run: |
          if [ ! -x bin/trivy ]; then
            mkdir -p bin
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b bin
          fi

      - uses: docker/setup-buildx-action@v3

      # Falls back to GITHUB_TOKEN if GHCR_PAT is unset.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Set image owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set image tag
        run: echo "TAG=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_ENV"

      # Load locally so Trivy scans the exact image before push.
      - name: Build (local, unpushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: decision-support-system:${{ env.TAG }}-${{ matrix.arch }}

      # Report-only, does not fail the build.
      - name: Trivy image scan (report)
        run: |
          ./bin/trivy image \
            --exit-code 0 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --no-progress \
            "decision-support-system:${{ env.TAG }}-${{ matrix.arch }}"

      - name: Tag and push
        run: |
          LOCAL="decision-support-system:${{ env.TAG }}-${{ matrix.arch }}"
          DEST="ghcr.io/${OWNER}/decision-support-system:${{ env.TAG }}-${{ matrix.arch }}"
          docker tag "$LOCAL" "$DEST"
          docker push "$DEST"

  manifest:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Set image owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set image tag
        run: echo "TAG=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_ENV"

      # Combines both arch images into one manifest.
      - name: Create multi-arch manifest
        run: |
          BASE="ghcr.io/${OWNER}/decision-support-system"
          docker buildx imagetools create \
            -t "${BASE}:${TAG}" \
            -t "${BASE}:latest" \
            "${BASE}:${TAG}-amd64" \
            "${BASE}:${TAG}-arm64"
