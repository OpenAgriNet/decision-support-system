name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # The framework-boundary test lives here. Tier 6 (eval) is excluded by
      # addopts in pyproject.toml and must never gate a merge.
      #
      # Coverage gates at 85%. Note that src/dss is currently all empty
      # __init__.py files: 0 statements reports as 100%, so this gate is
      # green for now without proving anything. It starts biting as soon as
      # the first core service lands.
      - name: Test
        run: uv run pytest --cov=src/dss --cov-report=term-missing --cov-fail-under=85
