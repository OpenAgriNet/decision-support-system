# Languages the DSS translates at its edges. The pipeline runs in `to`.
# A language not listed here is not translated.
# Nothing is read unless DSS_EDGE_TRANSLATION_CONFIG_PATH points at this file.
#
# The rules the loader enforces:
# - Keys are lowercase language subtags (gu, brx, bhb): no region, no script.
#   A gu entry also serves gu-IN.
# - `to` is any language tag, except the key's own language or another
#   language listed here. No loops, no chains.
# - `adapter: llm` names its `model`: a name the model gateway resolves, or a
#   Pydantic AI model string without one, like the `DSS_*_MODEL` settings.
#   `temperature` and `timeout_seconds` are optional.
# - `adapter: stub` takes only `to`: canned, no model, local runs only. Every
#   turn in its language asks "Will it rain today?", and answers come back
#   marked [gu].
languages:
  gu:
    to: en                       # the language the pipeline runs in for gu
    adapter: llm
    model: openai:gpt-4o-mini    # the composer's default model
    temperature: 0.0
    timeout_seconds: 20
  # bhb:                         # Bhili, through Marathi
  #   to: mr
  #   adapter: llm
  #   model: dss-translator-bhb
