# The speed benchmark's fixed question set, and the fake answers the mock
# network sends back for them.
#
# The questions are copied from the shared farmer benchmark, keeping each
# `id`. They are single-turn and in English, 10 per category.
#
# THE ANSWERS ARE FAKE. They exist so the composer has a real-sized text to
# read and stream from, and are used only to time the DSS. They are not
# agronomic advice and must never be served to a farmer.
#
# Per category:
# - mandi:    `commodity` and `market` are what the mock advertises at discover.
#             The codes are the mock's own, not real Agmarknet codes (except
#             Onion's). The answer's price is built in code.
# - weather:  `lon`/`lat` is the district's centre from the DSS district file.
#             It is sent as the turn's coordinates, because the DSS does not
#             pass a point it resolved by name on to /select.
# - advisory: the mock picks the question whose `match` words all appear in
#             the planner's `topics`. Each crop appears once, so the crop is
#             enough. `chil` covers both "chili" and "chilli".

