match = ["chil"]
answer = """
Armyworm on chili in Dhule is usually the tobacco caterpillar, Spodoptera. \
The young caterpillars feed in groups on the underside of leaves and leave \
them thin and papery. Older caterpillars scatter, feed at night and eat \
leaves, flowers and even young fruit, and can strip a field in a few days \
if they are not controlled. Early action is what saves the crop. Check the \
field twice a week, especially after rain. Look under the leaves for egg \
masses, which are covered with brown hair, and for patches of papery leaves \
with groups of tiny green caterpillars. Pick off and destroy these egg masses \
and young groups by hand. This simple step removes hundreds of caterpillars \
before they spread. Pheromone traps, placed at about four to five per acre, \
catch the male moths and tell you when a new generation is coming. Light \
traps also attract the moths at night. Plant a border of castor around the \
chili. The moths prefer to lay eggs on castor, so you can find and destroy \
them there. For young caterpillars, a spray of neem seed kernel extract at \
five percent, or a biological product based on Bacillus thuringiensis or on \
the Spodoptera virus called NPV, works well and is safe for friendly \
insects. Spray in the evening, because the caterpillars feed at night and \
the biological products break down in strong sunlight. If the caterpillars \
are older and numbers are high, a chemical spray may be needed. Commonly \
recommended options include emamectin benzoate 5 SG, chlorantraniliprole \
18.5 SC, and spinosad 45 SC, used strictly at the dose on the label. Spray \
thoroughly, covering the underside of the leaves, in the evening. Rotate \
between products from different groups for the next spray, because this pest \
quickly becomes resistant. Avoid broad-spectrum older insecticides, which \
kill the wasps and bugs that feed on armyworm and often make the problem \
worse later in the season. Chili is often sold fresh and also dried for \
spice, so respect the waiting period between the last spray and picking. \
Wear gloves, a mask and full clothing when spraying, and wash well \
afterwards. After harvest, plough the field deeply so the pupae in the soil \
are exposed to birds and the sun, and remove weeds around the field where \
the pest can survive between crops. If the attack is heavy or spreads fast, \
contact your local Krishi Vigyan Kendra for advice on the best product this \
season.
"""
