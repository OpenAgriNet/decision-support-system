# Local hooks can be bypassed with `--no-verify`, so CI runs the same checks.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^src/
      - id: ruff-check
        name: ruff-check (report only)
        args: [--exit-zero]
        files: ^(tests|benchmarks|tools)/
        verbose: true
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
