# Dev: docker compose --env-file .env up -d --build
# Deploy: docker compose --env-file .env pull && docker compose --env-file .env up -d
services:
  dss:
    image: ghcr.io/openagrinet/decision-support-system:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    # Nothing here is `${VAR:?...}`. That form fails while the file is being
    # *parsed*, so one unset variable stopped compose reading the file at all —
    # no `config`, and no starting the collector below on its own. The DSS
    # already refuses to boot on what it genuinely needs, and says what is
    # wrong when it does: an `azure:` model with no endpoint names both
    # variables, and the network configured with no schema packs names the
    # directory and the fetch command. Those beat a parse error.
    environment:
      # All four agents (ADR-0004), as names the model gateway resolves
      # (ADR-0013). Fixed, not overridable: which vendor and which model each
      # one means is the gateway's business, so changing a model is a change
      # there and never here. These four names are the contract between the
      # two, and the gateway's model list uses the same ones.
      DSS_INTENT_MODEL: dss-intent
      DSS_MODERATION_MODEL: dss-moderation
      DSS_PLANNER_MODEL: dss-planner
      DSS_COMPOSER_MODEL: dss-composer
      # Read from the environment by the model adapter, not through Settings.
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      # The gateway, by service name on the network below - not the published
      # port, which means nothing from inside a container. Fixed for the same
      # reason as the names above.
      DSS_GATEWAY_URL: http://litellm:4000/v1
      # The DSS's own credential for the gateway, and the only key it holds.
      # Vendor keys live in the gateway and never reach this process.
      DSS_GATEWAY_API_KEY: ${DSS_GATEWAY_API_KEY:-}
      # The collector, not Langfuse. It always runs, so this can default.
      # No credentials: the collector holds Langfuse's.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      # On: the collector forwards metrics to ClickHouse.
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
      # Delta, not cumulative: a rate panel then just sums rows.
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: ${OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE:-delta}
      # Tells DSS rows apart in a shared ClickHouse. Unset: `unknown_service`.
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-dss}
      # Keeps staging and production turns out of the same panel.
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=${DSS_ENV:-dev}
      # One name for the whole model configuration above, labelling every
      # turn-level metric. Nothing derives it — two deployments running the
      # same four models are only comparable if they say which is which.
      DSS_MODEL_PROFILE: ${DSS_MODEL_PROFILE:-default}
      # Only a literal "true" opts in. See ADR-0007 §5 before turning it on.
      DSS_TRACE_INCLUDE_MESSAGE_CONTENT: ${DSS_TRACE_INCLUDE_MESSAGE_CONTENT:-}
      DSS_INVOCATION_BASE_URL: ${DSS_INVOCATION_BASE_URL:-}
      DSS_DISCOVERY_BASE_URL: ${DSS_DISCOVERY_BASE_URL:-}
      # The published packs are on this tag, not on `main` — the settings
      # default is `main`, which carries none, so a container that does not
      # set this fetches nothing and then dies on the missing directory.
      DSS_SCHEMA_PACK_REF: ${DSS_SCHEMA_PACK_REF:-schema-packs-v0.1}
      # Read straight from os.environ by app.py, not through Settings, so it
      # has to be named here to reach the container at all. DEBUG is what puts
      # the /discover and /select request bodies in the log.
      DSS_LOG_LEVEL: ${DSS_LOG_LEVEL:-INFO}
      # Redaction of the farmer's identity details (ADR-0015). Off unless set to
      # true in .env. The rules file ships in the image; point the path at a
      # mounted file to use your own rules.
      DSS_REDACTION_ENABLED: ${DSS_REDACTION_ENABLED:-false}
      DSS_REDACTION_CONFIG_PATH: ${DSS_REDACTION_CONFIG_PATH:-/app/src/dss/config/examples/redaction-rules.yaml}
      # Translation (#174). Off unless set. The gateway is always on here, so
      # the file's `model` must be a gateway name: mount a copy, see RUNNING.md.
      DSS_EDGE_TRANSLATION_CONFIG_PATH: ${DSS_EDGE_TRANSLATION_CONFIG_PATH:-}
      # Which providers each sender wants, per capability (ADR-0019, ADR-0020).
      # The rankings live in the network registry, never in the DSS: set the
      # base URL and the DSS asks it on every turn for the request's senderId
      # and for `default`. Unset, no ranking applies and every ask keeps
      # whichever providers discovery found. Named here so they reach the
      # container at all.
      DSS_PROVIDER_PREFERENCES_BASE_URL: ${DSS_PROVIDER_PREFERENCES_BASE_URL:-}
      DSS_PROVIDER_PREFERENCES_TIMEOUT_SECONDS: ${DSS_PROVIDER_PREFERENCES_TIMEOUT_SECONDS:-3}
      # Photon, by service name. Set it empty in .env to turn Photon off; the
      # DSS then never asks it. Countries default to those in the area file.
      DSS_PHOTON_BASE_URL: ${DSS_PHOTON_BASE_URL:-http://photon:2322}
    ports:
      - "127.0.0.1:${DSS_HOST_PORT:-8077}:8077"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8077/openapi.json')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Export hub. No profile: the DSS points at it by default.
  # Sends content to Langfuse, and a content-free copy to ClickHouse.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_TAG:-latest}
    command:
      - --config=/etc/otel/collector.yaml
    volumes:
      - ./otel/collector.yaml:/etc/otel/collector.yaml:ro
    environment:
      # Reached by name over oan-edge, Langfuse's network.
      # The full path: the exporter posts to exactly this URL, and the bare
      # `/api/public/otel` is a 404.
      LANGFUSE_OTLP_ENDPOINT: ${LANGFUSE_OTLP_ENDPOINT:-http://langfuse-web:3000/api/public/otel/v1/traces}
      # `Basic $(printf '%s:%s' "$PUBLIC_KEY" "$SECRET_KEY" | base64)`.
      # A plain header value, so a literal space (not `%20`) is correct.
      LANGFUSE_AUTH_HEADER: ${LANGFUSE_AUTH_HEADER:-}
      # Native protocol: tcp://host:9000. No default: a wrong guess sends
      # telemetry where nobody looks.
      CLICKHOUSE_ENDPOINT: ${CLICKHOUSE_ENDPOINT:-}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      # May be shared. Check the tables' schema before a second collector writes.
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-otel}
    ports:
      # OTLP/HTTP. The DSS reaches it as http://otel-collector:4318 from
      # inside the compose network; the published port is for a DSS running on
      # the host instead. Move it where another collector (e.g. HyperDX)
      # already holds 4318 on the host.
      - "127.0.0.1:${OTEL_HOST_PORT:-4318}:4318"
    restart: unless-stopped

  # Place search for names the area file lacks. `photon-index` runs once: it
  # downloads the Photon jar and the India place index (about 600 MB) into the
  # volume, then exits. `photon` starts after that. The first start takes a
  # few minutes, later ones seconds. No `depends_on` from `dss`: a Photon that
  # is down counts as no answer, and the turn still finishes.
  photon-index:
    image: eclipse-temurin:21-jre
    working_dir: /photon
    restart: "no"
    volumes:
      - photon-data:/photon
    environment:
      PHOTON_VERSION: ${PHOTON_VERSION:-1.3.0}
      # Photon 1.x reads only the `1.0` index format.
      PHOTON_DB_URL: ${PHOTON_DB_URL:-https://download1.graphhopper.com/public/asia/india/photon-db-india-1.0-latest.tar.bz2}
    command:
      - bash
      - -c
      - |
        set -eo pipefail
        JAR="photon-$${PHOTON_VERSION}.jar"
        [ -f "$$JAR" ] || curl -fL -o "$$JAR" "https://github.com/komoot/photon/releases/download/$${PHOTON_VERSION}/$$JAR"
        # The marker holds the URL of the index that finished downloading. A
        # cut-short download leaves none, and a changed URL no longer matches.
        if [ "$$(cat .index-ready 2>/dev/null || true)" != "$$PHOTON_DB_URL" ]; then
          command -v bzip2 >/dev/null || { apt-get update -qq && apt-get install -y -qq bzip2; }
          rm -rf photon_data .index-ready
          curl -fL "$$PHOTON_DB_URL" | bzip2 -cd | tar x
          printf %s "$$PHOTON_DB_URL" > .index-ready
        fi

  photon:
    image: eclipse-temurin:21-jre
    working_dir: /photon
    depends_on:
      photon-index:
        condition: service_completed_successfully
    volumes:
      - photon-data:/photon
    environment:
      PHOTON_VERSION: ${PHOTON_VERSION:-1.3.0}
    command:
      - sh
      - -c
      - exec java -jar "photon-$${PHOTON_VERSION}.jar" serve -listen-ip 0.0.0.0
    # No published port: the DSS reaches it as http://photon:2322.
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:2322/api?q=Pune&limit=1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: unless-stopped

volumes:
  photon-data:

# `oan-edge` is the network Langfuse and the model gateway are already on, so
# naming it here is what lets the DSS reach `litellm` and `langfuse-web` by
# service name. Without it compose puts this project on a network of its own and
# every model call fails to resolve a host.
#
# Locally, where it does not exist yet:
#
#     docker network create oan-edge
#
networks:
  default:
    name: oan-edge
    external: true
