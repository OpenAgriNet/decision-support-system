# Dev: docker compose --env-file .env up -d --build
# Deploy: docker compose --env-file .env pull && docker compose --env-file .env up -d
services:
  dss:
    image: ghcr.io/openagrinet/decision-support-system:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    # Nothing here is `${VAR:?...}`. That form fails while the file is being
    # *parsed*, so one unset variable stopped compose reading the file at all —
    # no `config`, and no starting the collector below on its own. The DSS
    # already refuses to boot on what it genuinely needs, and says what is
    # wrong when it does: an `azure:` model with no endpoint names both
    # variables, and the network configured with no schema packs names the
    # directory and the fetch command. Those beat a parse error.
    environment:
      # All four agents (ADR-0004), as names the model gateway resolves
      # (ADR-0013). Fixed, not overridable: which vendor and which model each
      # one means is the gateway's business, so changing a model is a change
      # there and never here. These four names are the contract between the
      # two, and the gateway's model list uses the same ones.
      DSS_INTENT_MODEL: dss-intent
      DSS_MODERATION_MODEL: dss-moderation
      DSS_PLANNER_MODEL: dss-planner
      DSS_COMPOSER_MODEL: dss-composer
      # Read from the environment by the model adapter, not through Settings.
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      # The gateway, by service name on the network below - not the published
      # port, which means nothing from inside a container. Fixed for the same
      # reason as the names above.
      DSS_GATEWAY_URL: http://litellm:4000/v1
      # The DSS's own credential for the gateway, and the only key it holds.
      # Vendor keys live in the gateway and never reach this process.
      DSS_GATEWAY_API_KEY: ${DSS_GATEWAY_API_KEY:-}
      # The collector below, not Langfuse (ADR-0013). It is in this compose
      # file, so it is always there — which is why this has a default at all,
      # where before it was empty and telemetry was off unless someone asked.
      # No credentials here any more: the collector holds Langfuse's, because
      # it is the thing that talks to Langfuse.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      # On by default now. It shipped as `none` because the endpoint was
      # Langfuse and Langfuse discards metrics; the endpoint is a collector
      # that forwards them to ClickHouse, so the reason is gone. `dss.turn.*`,
      # `dss.stage.*` and the HTTP request metrics are what a dashboard reads;
      # Pydantic AI's own `gen_ai.*` token metrics come along with them.
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
      # Delta, not OTLP's default of cumulative. ClickHouse stores what it is
      # given, so a cumulative counter makes every rate panel compute a
      # windowed difference in SQL. Delta means a panel sums rows.
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: ${OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE:-delta}
      # What identifies these rows in a ClickHouse other services also write
      # to. Unset, every span and metric says `unknown_service` and no
      # dashboard can tell the DSS apart from anything else.
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-dss}
      # The second half of that: which deployment. Without it a staging turn
      # and a production turn land in the same panel.
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=${DSS_ENV:-dev}
      # One name for the whole model configuration above, labelling every
      # turn-level metric. Nothing derives it — two deployments running the
      # same four models are only comparable if they say which is which.
      DSS_MODEL_PROFILE: ${DSS_MODEL_PROFILE:-default}
      # Only a literal "true" opts in. See ADR-0007 §5 before turning it on.
      DSS_TRACE_INCLUDE_MESSAGE_CONTENT: ${DSS_TRACE_INCLUDE_MESSAGE_CONTENT:-}
      DSS_INVOCATION_BASE_URL: ${DSS_INVOCATION_BASE_URL:-}
      DSS_DISCOVERY_BASE_URL: ${DSS_DISCOVERY_BASE_URL:-}
      # The published packs are on this tag, not on `main` — the settings
      # default is `main`, which carries none, so a container that does not
      # set this fetches nothing and then dies on the missing directory.
      DSS_SCHEMA_PACK_REF: ${DSS_SCHEMA_PACK_REF:-schema-packs-v0.1}
      # Read straight from os.environ by app.py, not through Settings, so it
      # has to be named here to reach the container at all. DEBUG is what puts
      # the /discover and /select request bodies in the log.
      DSS_LOG_LEVEL: ${DSS_LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${DSS_HOST_PORT:-8077}:8077"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8077/openapi.json')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # The export hub (ADR-0013). No longer behind a profile: the DSS now points
  # at it by default, so it is part of the deployment rather than something to
  # start when you want to look. It fans one OTLP stream out to Langfuse (with
  # message content) and ClickHouse (without it — see otel/collector.yaml).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_TAG:-latest}
    command:
      - --config=/etc/otel/collector.yaml
    volumes:
      - ./otel/collector.yaml:/etc/otel/collector.yaml:ro
    environment:
      # Where the traces that keep their content go. Reached by service name
      # over oan-edge, which is the network Langfuse's own compose file
      # declares.
      LANGFUSE_OTLP_ENDPOINT: ${LANGFUSE_OTLP_ENDPOINT:-http://langfuse-web:3000/api/public/otel}
      # Moved here from the DSS. The collector is what talks to Langfuse, so
      # it is what needs the credential. Build it as
      # `Basic $(printf '%s:%s' "$PUBLIC_KEY" "$SECRET_KEY" | base64)` —
      # note this one is a plain header value, not the URL-encoded
      # OTEL_EXPORTER_OTLP_HEADERS list, so a literal space is correct here.
      LANGFUSE_AUTH_HEADER: ${LANGFUSE_AUTH_HEADER:-}
      # Native protocol, not HTTP: tcp://host:9000. No default — a wrong guess
      # here writes telemetry somewhere nobody is looking.
      CLICKHOUSE_ENDPOINT: ${CLICKHOUSE_ENDPOINT:-}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      # Shared with whatever else writes OTLP to this server. Check the
      # existing tables' schema before pointing a second collector at it.
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-otel}
    ports:
      # OTLP/HTTP. The DSS reaches it as http://otel-collector:4318 from
      # inside the compose network; the published port is for a DSS running on
      # the host instead.
      - "127.0.0.1:${OTEL_HOST_PORT:-4318}:4318"
    restart: unless-stopped

# `oan-edge` is the network Langfuse and the model gateway are already on, so
# naming it here is what lets the DSS reach `litellm` and `langfuse-web` by
# service name. Without it compose puts this project on a network of its own and
# every model call fails to resolve a host.
#
# Locally, where it does not exist yet:
#
#     docker network create oan-edge
#
networks:
  default:
    name: oan-edge
    external: true
