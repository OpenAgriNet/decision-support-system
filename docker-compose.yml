# Dev: docker compose --env-file .env up -d --build
# Deploy: docker compose --env-file .env pull && docker compose --env-file .env up -d
services:
  dss:
    image: ghcr.io/openagrinet/decision-support-system:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    # Nothing here is `${VAR:?...}`. That form fails while the file is being
    # *parsed*, so one unset variable stopped compose reading the file at all —
    # no `config`, and no starting the collector below on its own. The DSS
    # already refuses to boot on what it genuinely needs, and says what is
    # wrong when it does: an `azure:` model with no endpoint names both
    # variables, and the network configured with no schema packs names the
    # directory and the fetch command. Those beat a parse error.
    environment:
      # All four agents (ADR-0004). The part after `azure:` is the deployment
      # id; any other prefix is handed to Pydantic AI as-is.
      DSS_INTENT_MODEL: ${DSS_INTENT_MODEL:-azure:gpt-5.6-luna}
      DSS_MODERATION_MODEL: ${DSS_MODERATION_MODEL:-azure:gpt-5.6-luna}
      DSS_PLANNER_MODEL: ${DSS_PLANNER_MODEL:-azure:gpt-5.6-luna}
      DSS_COMPOSER_MODEL: ${DSS_COMPOSER_MODEL:-azure:gpt-5.6-luna}
      # Read from the environment by the model adapter, not through Settings.
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      # Read by the OpenAI SDK itself, under its own names. Unset, it goes to
      # api.openai.com; pointed at an OpenAI-compatible proxy (LiteLLM, vLLM)
      # a non-`azure:` model string reaches that instead, with no code change.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Without these three the container exports nothing useful: no auth means
      # 401 on every batch, and no content means spans that say what ran but not
      # what was asked. Setting the endpoint alone is the easy mistake.
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      # Off by default, and deliberately: the usual endpoint above is Langfuse,
      # which discards metrics, so leaving this on means one pointless POST per
      # interval. Set it to `otlp` when the endpoint is a Collector that
      # forwards metrics somewhere — then `dss.turn.*`, `dss.stage.*` and the
      # HTTP request metrics leave the process. Pydantic AI's own `gen_ai.*`
      # token metrics come along with them; `dss.*` is what a dashboard reads.
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
      # One name for the whole model configuration above, labelling every
      # turn-level metric. Nothing derives it — two deployments running the
      # same four models are only comparable if they say which is which.
      DSS_MODEL_PROFILE: ${DSS_MODEL_PROFILE:-default}
      # Only a literal "true" opts in. See ADR-0007 §5 before turning it on.
      DSS_TRACE_INCLUDE_MESSAGE_CONTENT: ${DSS_TRACE_INCLUDE_MESSAGE_CONTENT:-}
      DSS_INVOCATION_BASE_URL: ${DSS_INVOCATION_BASE_URL:-}
      DSS_DISCOVERY_BASE_URL: ${DSS_DISCOVERY_BASE_URL:-}
      # The published packs are on this tag, not on `main` — the settings
      # default is `main`, which carries none, so a container that does not
      # set this fetches nothing and then dies on the missing directory.
      DSS_SCHEMA_PACK_REF: ${DSS_SCHEMA_PACK_REF:-schema-packs-v0.1}
      # Read straight from os.environ by app.py, not through Settings, so it
      # has to be named here to reach the container at all. DEBUG is what puts
      # the /discover and /select request bodies in the log.
      DSS_LOG_LEVEL: ${DSS_LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${DSS_HOST_PORT:-8077}:8077"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8077/openapi.json')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Somewhere for the spans to go. Behind a profile, so the default `up` does
  # not start it:
  #
  #     docker compose --profile tracing up -d
  #
  # Only worth starting when you want to look. Nothing listening on the
  # endpoint means the DSS's exporter retries loudly and buries the rest of
  # the log — so leave OTEL_EXPORTER_OTLP_ENDPOINT unset otherwise, which is
  # its default.
  otel-collector:
    profiles: [tracing]
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_TAG:-latest}
    # Printing to its own log is the whole job here. A deployment replaces
    # this with a config that forwards to Langfuse or wherever else, which is
    # why the config is a mounted file rather than baked in.
    command:
      - --config=/etc/otel/collector.yaml
    volumes:
      - ./otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      # OTLP/HTTP. The DSS reaches it as http://otel-collector:4318 from
      # inside the compose network; the published port is for a DSS running on
      # the host instead.
      - "127.0.0.1:${OTEL_HOST_PORT:-4318}:4318"
    restart: unless-stopped
